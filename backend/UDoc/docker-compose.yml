version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# UDoc — Docker Compose
#
# Uso básico (sem IA local):
#   docker compose up -d
#
# Com Ollama (Llama + Qwen rodando localmente):
#   docker compose --profile ollama up -d
#   ./setup.sh --ollama          (Linux/Mac — baixa os modelos)
#   setup.bat --ollama           (Windows   — baixa os modelos)
#
# Copie .env.example para .env e preencha antes de subir.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: udoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: udoc
      POSTGRES_USER: ${DATABASE_USERNAME:-udoc}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-udoc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build: .
    container_name: udoc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/udoc
      DATABASE_USERNAME: ${DATABASE_USERNAME:-udoc}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: 8081
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@udoc.com}
      AI_KEY: ${AI_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Ollama — aponta para o serviço interno quando o profile "ollama" está ativo
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://ollama:11434/v1/chat/completions}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

  # ── Ollama (modelos locais) — ativado com: --profile ollama ─────────────────
  ollama:
    image: ollama/ollama
    container_name: udoc-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama   # modelos persistem entre restarts
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  # ── Cloudflare Tunnel — expõe o Ollama para o backend na nuvem ───────────────
  # Crie o túnel em dash.cloudflare.com → Zero Trust → Networks → Tunnels
  # Configure o Public Hostname apontando para: http://ollama:11434
  # Copie o token gerado e adicione CLOUDFLARE_TUNNEL_TOKEN no .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: udoc-cloudflared
    profiles: ["ollama"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  ollama_data:   # volume dedicado para modelos — nunca vai para o Git
