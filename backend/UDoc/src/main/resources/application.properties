spring.application.name=UDoc
spring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/udoc
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

cors.allowed-origin=http://localhost:5173

jwt.secret=UDocSecretKey2024VeryLongAndSecureKeyForJWTSigningAtLeast256BitsLong!!
jwt.expiration-ms=86400000

# Em produção sobrescreva com a URL real: -DAPP_FRONTEND_URL=https://seu-dominio.com
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# SendGrid via SMTP (padrão do sistema para reset de senha)
# Obtenha a API key em: https://app.sendgrid.com → Settings → API Keys
# Em produção defina a variável de ambiente SENDGRID_API_KEY=SG.xxxxxx
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:coloque-sua-api-key-aqui}

# E-mail remetente padrão (deve ser verificado no SendGrid)
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@udoc.com}
app.mail.from-name=UDoc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

ai.key=${AI_KEY:valor_padrao}
ai.model=llama-3.3-70b-versatile

# Chave de criptografia AES-256 para API keys no banco — NUNCA comitar o valor real
# Defina ENCRYPTION_KEY como variável de ambiente no servidor de produção
encryption.key=${ENCRYPTION_KEY:UDoc_Default_Change_In_Production_2024!!}

# Upload de gravações de vídeo — aumentar limite para suportar arquivos grandes
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.upload.dir=uploads/recordings

# Remove limite padrão do Tomcat (2MB) para requisições multipart grandes
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1