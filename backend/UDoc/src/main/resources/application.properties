spring.application.name=UDoc
spring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/udoc
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

cors.allowed-origin=http://localhost:5173

jwt.secret=UDocSecretKey2024VeryLongAndSecureKeyForJWTSigningAtLeast256BitsLong!!
jwt.expiration-ms=86400000

app.frontend-url=http://localhost:5173

# SendGrid via SMTP (padrão do sistema para reset de senha)
# Obtenha a API key em: https://app.sendgrid.com → Settings → API Keys
# Em produção defina a variável de ambiente SENDGRID_API_KEY=SG.xxxxxx
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:coloque-sua-api-key-aqui}

# E-mail remetente padrão (deve ser verificado no SendGrid)
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@udoc.com}
app.mail.from-name=UDoc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

ai.key=${AI_KEY:valor_padrao}
ai.model=llama-3.3-70b-versatile